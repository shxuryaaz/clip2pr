<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip2PR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #10162b;
  --panel: #182040;
  --line: #2a3460;
  --text: #e8ecf8;
  --muted: #8a93b2;
  --accent: #9db2ff;
  --bug: #ff6b5b;
  --add: #7fd4a8;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ink); color: var(--text);
  font: 15px/1.55 "IBM Plex Sans", system-ui, sans-serif;
}
header { padding: 28px 32px 8px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
h1 { font: 800 40px/1 "Bricolage Grotesque", sans-serif; letter-spacing: -0.02em; margin: 0; }
h1 span { color: var(--accent); }
header p { margin: 0; color: var(--muted); }
main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 24px; padding: 20px 32px 40px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.label { font: 600 12px/1 "JetBrains Mono", monospace; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 10px; }

/* Left: the tape */
#drop {
  aspect-ratio: 16 / 9; border: 2px dashed var(--line); border-radius: 10px;
  display: grid; place-items: center; text-align: center; color: var(--muted); cursor: pointer; overflow: hidden;
}
#drop.over { border-color: var(--accent); color: var(--text); }
#drop strong { display: block; color: var(--text); font-size: 17px; }
video { width: 100%; height: 100%; background: #000; display: block; }
#tape { position: relative; height: 54px; margin-top: 14px; border-top: 1px solid var(--line); }
#tape .playhead { position: absolute; top: -4px; width: 2px; height: 30px; background: var(--text); opacity: .5; }
.tick {
  position: absolute; top: 0; transform: translateX(-50%); background: none; border: 0; padding: 0;
  color: var(--muted); font: 11px "JetBrains Mono", monospace; cursor: pointer; text-align: center;
}
.tick::before { content: ""; display: block; width: 2px; height: 12px; margin: 0 auto 4px; background: var(--accent); }
.tick.bug { color: var(--bug); font-weight: 600; }
.tick.bug::before { width: 4px; height: 22px; background: var(--bug); }
#steps { list-style: none; margin: 10px 0 0; padding: 0; }
#steps li { display: flex; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
#steps li:hover { color: var(--accent); }
#steps time { font: 600 13px "JetBrains Mono", monospace; color: var(--accent); min-width: 44px; }

/* Right: controls, log, verdict */
form { display: flex; flex-direction: column; gap: 10px; }
input[type=url] {
  font: 14px "JetBrains Mono", monospace; color: var(--text); background: var(--ink);
  border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px;
}
.row { display: flex; gap: 10px; }
button { font: 600 15px "IBM Plex Sans", sans-serif; border: 0; border-radius: 8px; padding: 11px 16px; cursor: pointer; }
#go { flex: 1; background: var(--accent); color: var(--ink); }
#go:disabled { opacity: .45; cursor: progress; }
#sample { background: transparent; color: var(--muted); border: 1px solid var(--line); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#log { font: 13px/1.7 "JetBrains Mono", monospace; color: var(--muted); margin: 16px 0 0; padding: 0; list-style: none; }
#log li::before { content: "› "; color: var(--accent); }
#log li:last-child { color: var(--text); }
#log li.err { color: var(--bug); }
#log li.err::before { content: "× "; color: var(--bug); }
#verdict { margin-top: 18px; display: none; }
#verdict h2 { font: 800 26px/1.15 "Bricolage Grotesque", sans-serif; margin: 0 0 14px; }
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.vs div { background: var(--ink); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.vs .saw { border-left: 3px solid var(--bug); }
.vs .want { border-left: 3px solid var(--add); }
.cause { color: var(--muted); font-size: 14px; }
.cause code { font: 12.5px "JetBrains Mono", monospace; color: var(--text); background: var(--ink); padding: 1px 5px; border-radius: 4px; }
pre {
  background: var(--ink); border-radius: 8px; padding: 12px; overflow-x: auto;
  font: 12.5px/1.6 "JetBrains Mono", monospace; margin: 14px 0;
}
pre .a { color: var(--add); } pre .d { color: var(--bug); } pre .h { color: var(--accent); }
#pr { display: inline-block; background: var(--add); color: var(--ink); text-decoration: none; font-weight: 600; padding: 11px 16px; border-radius: 8px; }
#model { font: 12px "JetBrains Mono", monospace; color: var(--muted); margin-left: 10px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 16px; } header { padding: 20px 16px 0; } }
@media (prefers-reduced-motion: no-preference) { #verdict { animation: up .35s ease-out; } }
@keyframes up { from { opacity: 0; transform: translateY(8px); } }
</style>
</head>
<body>
<header>
  <h1>Clip<span>2</span>PR</h1>
  <p>Record the bug. Get the pull request.</p>
</header>

<main>
  <section class="card">
    <p class="label">Recording</p>
    <div id="drop" tabindex="0" role="button" aria-label="Choose a screen recording">
      <div><strong>Drop a screen recording here</strong>or click to choose one. No description needed.</div>
    </div>
    <input id="file" type="file" accept="video/*" hidden>
    <div id="tape" aria-label="What Gemini saw in the recording"></div>
    <ol id="steps"></ol>
  </section>

  <section class="card">
    <p class="label">Repository</p>
    <form id="form">
      <input id="repo" type="url" required placeholder="https://github.com/you/your-app">
      <div class="row">
        <button id="go" type="submit">Find and fix</button>
        <button id="sample" type="button">Use the demo shop</button>
      </div>
    </form>
    <ul id="log"></ul>

    <div id="verdict">
      <p class="label">Gemini's verdict</p>
      <h2 id="title"></h2>
      <div class="vs">
        <div class="saw"><p class="label" id="sawAt">On screen</p><span id="saw"></span></div>
        <div class="want"><p class="label">Should have been</p><span id="want"></span></div>
      </div>
      <p class="cause" id="cause"></p>
      <pre id="diff"></pre>
      <a id="pr" target="_blank" rel="noopener">Open the pull request</a><span id="model"></span>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let clip = null;

function setClip(blob, name) {
  clip = new File([blob], name, { type: blob.type || 'video/webm' });
  $('drop').innerHTML = '<video controls muted></video>';
  $('drop').querySelector('video').src = URL.createObjectURL(clip);
  $('tape').innerHTML = ''; $('steps').innerHTML = '';
}

$('drop').onclick = () => !clip && $('file').click();
$('drop').onkeydown = e => (e.key === 'Enter' || e.key === ' ') && !clip && $('file').click();
$('file').onchange = e => e.target.files[0] && setClip(e.target.files[0], e.target.files[0].name);
$('drop').ondragover = e => { e.preventDefault(); $('drop').classList.add('over'); };
$('drop').ondragleave = () => $('drop').classList.remove('over');
$('drop').ondrop = e => {
  e.preventDefault(); $('drop').classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f) setClip(f, f.name);
};

$('sample').onclick = async () => {
  const r = await fetch('/sample');
  setClip(await r.blob(), 'double-charge.mp4');
  $('repo').value = 'https://github.com/shxuryaaz/clip2pr-demo-shop';
};

const log = (text, cls) => {
  const li = document.createElement('li');
  li.textContent = text; if (cls) li.className = cls;
  $('log').append(li);
};

const secs = t => { const m = /(\d+):(\d+)/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; };

function seek(t) {
  const v = $('drop').querySelector('video');
  if (v && t != null) { v.currentTime = t; v.play(); }
}

function drawTape(fix) {
  const v = $('drop').querySelector('video');
  const dur = v && isFinite(v.duration) ? v.duration : 15;
  const at = (t, label, bug) => {
    const b = document.createElement('button');
    b.className = 'tick' + (bug ? ' bug' : '');
    b.style.left = Math.min(98, Math.max(2, t / dur * 100)) + '%';
    b.textContent = label; b.onclick = () => seek(t);
    $('tape').append(b);
  };
  const bug = secs(fix.seen_at);
  fix.steps_seen.forEach(s => { const t = secs(s); if (t != null && t !== bug) at(t, s.match(/\d+:\d+/)[0]); });
  if (bug != null) at(bug, 'bug ' + fix.seen_at, true);

  $('steps').innerHTML = '';
  fix.steps_seen.forEach(s => {
    const li = document.createElement('li');
    const ts = (s.match(/\d+:\d+/) || [''])[0];
    li.innerHTML = `<time></time><span></span>`;
    li.querySelector('time').textContent = ts;
    li.querySelector('span').textContent = s.replace(/^\s*\d+:\d+\s*[-:–]?\s*/, '');
    li.onclick = () => seek(secs(ts));
    $('steps').append(li);
  });
}

function showDiff(text) {
  $('diff').innerHTML = '';
  text.split('\n').forEach(line => {
    const span = document.createElement('span');
    span.className = line.startsWith('@@') ? 'h' : line.startsWith('+') ? 'a' : line.startsWith('-') ? 'd' : '';
    span.textContent = line + '\n';
    $('diff').append(span);
  });
}

function showFix(fix) {
  $('title').textContent = fix.bug_title;
  $('sawAt').textContent = 'On screen at ' + fix.seen_at;
  $('saw').textContent = fix.on_screen;
  $('want').textContent = fix.expected;
  // Gemini writes `code` in markdown; show it as code, everything else as plain text.
  $('cause').innerHTML = '';
  fix.root_cause.split('`').forEach((part, i) => {
    const el = document.createElement(i % 2 ? 'code' : 'span');
    el.textContent = part; $('cause').append(el);
  });
  showDiff(fix.diff);
  $('pr').href = fix.pr_url;
  $('model').textContent = fix.model;
  $('verdict').style.display = 'block';
  drawTape(fix);
}

$('form').onsubmit = async e => {
  e.preventDefault();
  if (!clip) { log('Add a screen recording first.', 'err'); return; }
  $('go').disabled = true; $('log').innerHTML = ''; $('verdict').style.display = 'none';
  const body = new FormData();
  body.append('video', clip); body.append('repo', $('repo').value);
  try {
    const res = await fetch('/fix', { method: 'POST', body });
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const msg = JSON.parse(buf.slice(0, i)); buf = buf.slice(i + 1);
        if (msg.step) log(msg.step);
        if (msg.error) log(msg.error, 'err');
        if (msg.done) { log('Pull request opened'); showFix(msg.done); }
      }
    }
  } catch (err) {
    log('Lost the connection to the Clip2PR server. Check it is still running and try again.', 'err');
  }
  $('go').disabled = false;
};
</script>
</body>
</html>
